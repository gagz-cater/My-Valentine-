<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💘</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url("https://i.ibb.co/6Jr7bQ1/val-bg.png") center/cover no-repeat;
      font-family: "Comic Sans MS", cursive, sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 192, 203, 0.35);
      backdrop-filter: blur(10px);
      padding: 40px 20px;
      border-radius: 25px;
      text-align: center;
      width: 85%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 40px;
      color: white;
      margin-bottom: 10px;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    p {
      font-size: 20px;
      color: white;
      opacity: 0.9;
      margin-bottom: 30px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .btn {
      border: none;
      padding: 18px 40px;
      border-radius: 50px;
      font-size: 30px;
      cursor: pointer;
      margin: 10px;
      transition: 0.2s ease;
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    #yesBtn {
      background: #ff2d6f;
      color: white;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
    }

    #noBtn {
      background: #2f2f2f;
      color: white;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
    }

    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .popup-box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      width: 85%;
      max-width: 360px;
      text-align: center;
      font-size: 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }

    .popup-box button {
      margin-top: 15px;
      padding: 10px 22px;
      border: none;
      border-radius: 12px;
      background: #ff2d6f;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>
      Hey Pumpkin, Will you be my Valentine? 🥺💘? 💖✨
    </h1>

    <p>Choose wisely 😌💘</p>

    <button class="btn" id="yesBtn">YES 💘</button>
    <button class="btn" id="noBtn">NO 🙄</button>
  </div>

  <div class="popup" id="popup">
    <div class="popup-box">
      Yayyy! 😍💘💖 <br><br>
      I knew you’d say YES 😌✨
      <br>
      <button onclick="closePopup()">Okay 💕</button>
    </div>
  </div>

  <script>
    let yesSize = 1;
    let noSize = 1;

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const popup = document.getElementById("popup");

    // YES button click
    yesBtn.addEventListener("click", () => {
      popup.style.display = "flex";
    });

    // NO button click (shrinks fast + yes grows)
    noBtn.addEventListener("click", () => {
      // YES grows slowly but clearly
      yesSize += 0.15;

      // NO shrinks FAST (so around 10-15 taps it becomes tiny)
      noSize -= 0.08;

      // Stop NO from disappearing fully (tiny minimum)
      if (noSize < 0.08) noSize = 0.08;

      yesBtn.style.transform = `scale(${yesSize})`;
      noBtn.style.transform = `scale(${noSize})`;
    });

    function closePopup() {
      popup.style.display = "none";
    }
  </script>
</body>
</html>
